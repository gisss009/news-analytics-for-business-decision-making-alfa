# Весь прототип одной командой: docker compose up
#   http://localhost:5174 — сводка web/
#   http://localhost:5173 — интерфейс аналитического ядра frontend/
#   http://localhost:8000/docs — API ядра
# Режим модели берётся из .env (LLM_MODE=stub по умолчанию, ключ не нужен). Остановка — Ctrl+C или docker compose down.

services:
  backend:
    image: python:3.12-slim
    working_dir: /repo/backend
    volumes:
      - .:/repo
      - pip_cache:/root/.cache/pip
    environment:
      LLM_MODE: ${LLM_MODE:-stub}
      PYTHONUTF8: "1"
    env_file:
      - path: .env
        required: false
    command: >
      sh -c "pip install -q -r requirements.txt &&
             python -m app.data.loader --source synthetic &&
             python -m app.ingest.pipeline --news fixtures --analytics auto &&
             uvicorn app.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      retries: 60

  frontend:
    image: node:24-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_POLL: "1"
    command: sh -c "npm install --no-audit --no-fund --loglevel=error && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  parser:
    image: python:3.12-slim
    working_dir: /repo
    volumes:
      - .:/repo
      - pip_cache:/root/.cache/pip
    environment:
      PYTHONUTF8: "1"
    command: >
      sh -c "pip install -q -r requirements.txt &&
             python -c 'import sys; sys.path.insert(0, \"scripts\"); import web; web.prepare_bank_pdfs()' &&
             python -m parser && python -m parser._pull_business"

  web:
    image: node:24-slim
    working_dir: /repo/web
    volumes:
      - .:/repo
      - web_node_modules:/repo/web/node_modules
    command: sh -c "npm install --no-audit --no-fund --loglevel=error && npx vite --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    depends_on:
      parser:
        condition: service_completed_successfully

volumes:
  pip_cache:
  frontend_node_modules:
    name: news_analytics_frontend_node_modules
  web_node_modules:
    name: news_analytics_web_node_modules
