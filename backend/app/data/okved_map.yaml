# ОКВЭД → отрасль → чувствительность к макрофакторам (0..1).
# Поиск по самому длинному совпавшему префиксу кода (например "46.71" раньше "46").
# Новая отрасль = новая запись здесь, без правки Python.
# Факторы: rate (ключевая ставка), fx (курс), oil, metals, gold, grain (цены сырья),
#          inflation (инфляция издержек), demand (потребительский спрос), regulation, sanctions (санкции и ВЭД).
# keywords: слова для сопоставления новостей с отраслью (ing.classify).

defaults:
  unknown_sector: other
  unknown_confidence: 0.3
  group_confidence: 0.7      # совпадение только по 2 цифрам
  exact_confidence: 0.95     # совпадение по уточнённому префиксу

