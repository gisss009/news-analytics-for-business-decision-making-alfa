# Параметры конвейера контента
dedupe:
  window_hours: 48        # дубли ищем среди новостей, опубликованных не дальше этого окна
  threshold: 0.35         # порог похожести для объединения в одно событие
  weight_words: 0.5       # вес совпадения основ слов (Jaccard)
  weight_numbers: 0.5     # вес совпадения чисел (Jaccard): пересказы обычно сохраняют цифры

classify:
  title_weight: 2.0       # совпадение в заголовке весит больше
  min_score: 2.0          # ниже — тема 'other'
  # тема → регулярные выражения (по тексту в нижнем регистре) и вес совпадения
  topics:
    rate:
      - ['ключев\w* ставк', 3]
      - ['банк\w* росси|\bцб\b', 1.5]
      - ['денежно-кредитн|\bдкп\b', 2]
      - ['кредит', 1]
      - ['лизинг', 1]
      - ['заседани', 1]
    fx:
      - ['\bкурс', 2]
      - ['ослабл\w* рубл|рубл\w* ослаб|слаб\w* рубл', 2]
      - ['доллар|юан', 1.5]
      - ['валют', 1.5]
      - ['импорт', 1]
      - ['рублёв\w* выручк|рублев\w* выручк', 2]
    commodities:
      - ['нефт|brent|urals|опек', 2]
      - ['золот|драгмет|унци', 2]
      - ['\bстал\w*|прокат|металл', 1.5]
      - ['пшениц|зерн|урожа', 1.5]
      - ['бензин|дизел|топлив|нефтепродукт', 1.5]
      - ['баррел|тонн', 0.5]
    inflation:
      - ['инфляц|дефляц', 3]
      - ['росстат', 1]
      - ['закупочн\w* цен|отпускн\w* цен|цен\w* выросл|подорожа', 1.5]
    regulation:
      - ['закон|требовани|лимит', 2]
      - ['утильсбор|утилизационн', 3]
      - ['тариф', 1.5]
      - ['пошлин|маркировк', 2]
      - ['ипотек', 1]
      - ['правительств|минпромторг', 1]
    taxes:
      - ['налог|\bндс\b|\bндпи\b', 3]
      - ['льгот', 1.5]
      - ['бюджет', 1]
    sanctions_trade:
      - ['санкци|ограничени', 2.5]
      - ['платеж|предоплат', 1.5]
      - ['транзит|таможен', 2]
      - ['посредник', 1.5]
    industry:
      - ['продаж|оборот', 1.5]
      - ['ввод\w* жиль|ввели|новострое', 2]
      - ['урожа|производств', 1]
      - ['спрос', 1]
      - ['грузоперевоз|перевозк|перевозчик', 1.5]
    capital_markets:
      - ['облигац|\bофз\b|флоатер|купон', 2.5]
      - ['доходност', 1.5]
      - ['мосбирж|индекс\w* акци|\bакци', 2]
  geo:
    CN: 'кита|юан'
    TR: 'турц|турецк'
    KZ: 'казахстан'
    UZ: 'узбекист'
    EU: 'евросоюз|\bес\b|европ'
    AE: '\bоаэ\b'
    GLOBAL: 'опек|brent|мир\w* рын|центральн\w* банк|фрс'
    RU: 'росси|рубл|москв|\bцб\b|минфин|росстат|приморь|владивосток|черного моря|чёрного моря'
  entities:
    - ['Банк России', 'банк\w* росси|\bцб\b']
    - ['Росстат', 'росстат']
    - ['Минфин', 'минфин']
    - ['Минпромторг', 'минпромторг']
    - ['Правительство РФ', 'правительств']
    - ['ОПЕК+', 'опек']
    - ['Народный банк Китая', 'народный банк китая']
    - ['Евросоюз', 'евросоюз']
    - ['МосБиржа', 'мосбирж']
